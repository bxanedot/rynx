name: Android phone runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rynx-phone-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone and instrumentation APKs
        run: ./gradlew :app:android:assembleDebug :app:android:assembleDebugAndroidTest --console=plain
      - name: Upload installable debug APK
        id: debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: rynx-debug-apk
          path: app/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Share debug APK artifact link
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.debug-apk.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_URL"
          echo "Rynx debug APK artifact: $ARTIFACT_URL"
          {
            echo "## Installable Rynx debug APK"
            echo
            echo "[Download the APK artifact]($ARTIFACT_URL) and extract the ZIP. Install the contained `android-debug.apk`."
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enable Android hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run actual phone tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash tools/android-connected-check.sh --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-test-results
          path: |
            app/android/build/reports/
            app/android/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
