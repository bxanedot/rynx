name: Verify Android-first Rynx
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Audit source boundary
        run: python3 tools/audit_workspace.py
      - name: Build Android variants and run shared/provider checks
        run: ./gradlew :apps:android:assembleDebug :apps:android:assembleRelease :apps:android:assembleDebugAndroidTest :apps:android:lintDebug :apps:android:testDebugUnitTest :apps:desktop:jvmTest :providers:apple:jvmTest :providers:innertubex:jvmTest :providers:newpipe:compileAndroidMain :shared:playback:jvmTest :shared:design:jvmTest :shared:ui:jvmTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-development
          path: |
            apps/android/build/outputs/apk/
            apps/android/build/reports/
            apps/android/build/test-results/
            shared/playback/build/reports/
            shared/design/build/reports/
            shared/ui/build/reports/
            apps/desktop/build/reports/screenshots/
