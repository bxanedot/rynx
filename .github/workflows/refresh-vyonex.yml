name: Refresh verified stable VyonEx hourly
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-vyonex
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Refresh stable dependency and provenance pins
        run: python3 tools/refresh_vyonex.py
      - name: Audit candidate
        run: python3 tools/audit_workspace.py
      - name: Verify candidate
        run: ./gradlew :apps:android:assembleDebug :apps:android:assembleRelease :apps:android:lintDebug :apps:android:testDebugUnitTest :apps:desktop:jvmTest :providers:vyonex:jvmTest :providers:newpipe:compileAndroidMain :shared:playback:jvmTest :shared:design:jvmTest :shared:ui:jvmTest --console=plain
      - name: Adopt the passing stable pin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dependencies/vyonex-clean tools/audit_workspace.py docs/cleanroom/DEPENDENCY_AUDIT.md docs/parity/VYONEX_INTEGRATION.md
          git commit -m 'chore: refresh verified stable VyonEx'
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Preserve a failed candidate for review
        if: failure()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: dependencies/vyonex-compatibility
          title: Resolve compatibility with latest stable VyonEx
          commit-message: Propose latest stable VyonEx for compatibility review
          body: The hourly stable VyonEx candidate did not pass validation. The default branch retains its previous pin. Check the failed workflow before adopting this candidate.
