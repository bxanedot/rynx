name: Android phone runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: rynx-phone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone and instrumentation APKs
        run: ./gradlew :apps:android:assembleDebug :apps:android:assembleDebugAndroidTest --console=plain
      - name: Enable Android hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run actual phone tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash tools/android-connected-check.sh --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone
          path: |
            apps/android/build/outputs/apk/
            apps/android/build/reports/
